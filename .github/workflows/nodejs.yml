name: Node CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Выкладка образа не прерывается новым запуском, он ждёт своей очереди
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Node берётся из mise.toml
      - uses: jdx/mise-action@v5
      - run: make setup
      # Те же шаги, что в git-хуке: hk.pkl
      - run: mise exec -- hk check --all
      - run: make test

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event_name == 'push' }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          cache-from: hexletcomponents/fastify-nodejs-application:latest
          cache-to: type=inline
          tags: hexletcomponents/fastify-nodejs-application:latest
